
name: LAB Consolidated Synthetic Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Run synthetic validation batch
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="batch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          A="${PREFIX}-a"
          B="${PREFIX}-b"

          cleanup() {
            docker rm -f "$A" "$B" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "=== Prepare public image ==="
          docker pull alpine:3.20

          echo "=== Create two independent workers ==="
          for NAME in "$A" "$B"; do
            docker run -d \
              --name "$NAME" \
              --network none \
              --cpus 1 \
              --memory 512m \
              --memory-swap 512m \
              --pids-limit 64 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,noexec,size=256m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --user 65534:65534 \
              alpine:3.20 \
              sh -c 'while :; do sleep 1; done'
          done

          echo "=== T1: storage separation ==="
          docker exec "$A" sh -c \
            'echo CASE_A > /tmp/case.txt'

          docker exec "$B" sh -c \
            'test ! -e /tmp/case.txt'

          docker exec "$B" sh -c \
            'echo CASE_B > /tmp/case.txt'

          test "$(docker exec "$A" \
            cat /tmp/case.txt)" = "CASE_A"

          test "$(docker exec "$B" \
            cat /tmp/case.txt)" = "CASE_B"

          echo "PASS T1: independent temporary storage"

          echo "=== T2: resource limits ==="
          for NAME in "$A" "$B"; do
            test "$(docker inspect -f \
              '{{.HostConfig.Memory}}' "$NAME")" \
              -eq 536870912

            test "$(docker inspect -f \
              '{{.HostConfig.PidsLimit}}' "$NAME")" \
              -eq 64

            test "$(docker inspect -f \
              '{{.HostConfig.NetworkMode}}' "$NAME")" \
              = "none"

            docker exec "$NAME" sh -c '
              if [ -f /sys/fs/cgroup/memory.max ]; then
                test "$(cat /sys/fs/cgroup/memory.max)" \
                  = "536870912"
                echo "PASS: memory cgroup limit"
              else
                echo "NOT_PROVEN: cgroup memory limit"
              fi
            '
          done

          echo "PASS T2: declared resource limits"

          echo "=== T3: external stop ==="
          START=$(date +%s%3N)

          timeout 5s docker kill "$A" "$B" \
            >/dev/null

          END=$(date +%s%3N)
          ELAPSED=$((END - START))

          test "$ELAPSED" -le 5000

          for NAME in "$A" "$B"; do
            test "$(docker inspect -f \
              '{{.State.Running}}' "$NAME")" \
              = "false"
          done

          echo "Stop duration: ${ELAPSED} ms"
          echo "PASS T3: both workers stopped"

          echo "=== T4: cleanup ==="
          cleanup

          for NAME in "$A" "$B"; do
            if docker inspect "$NAME" \
              >/dev/null 2>&1; then
              echo "FAIL: residual worker"
              exit 1
            fi
          done

          trap - EXIT

          echo "PASS T4: own workers removed"
          echo "PASS: consolidated synthetic batch"
