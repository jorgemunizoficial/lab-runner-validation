
name: LAB Consolidated Synthetic Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Run synthetic controls T9-T12
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="batch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          A="${PREFIX}-a"
          B="${PREFIX}-b"
          C="${PREFIX}-failure"
          WORKER_PID=""

          cleanup() {
            if [ -n "$WORKER_PID" ]; then
              kill "$WORKER_PID" 2>/dev/null || true
              wait "$WORKER_PID" 2>/dev/null || true
            fi
            docker rm -f "$A" "$B" "$C" \
              >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          IMAGE="alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"

          echo "=== Prepare public image ==="
          docker pull "$IMAGE"

          echo "=== Create synthetic workers ==="
          for NAME in "$A" "$B"; do
            docker run -d \
              --name "$NAME" \
              --network none \
              --cpus 1 \
              --memory 512m \
              --memory-swap 512m \
              --pids-limit 64 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,noexec,size=256m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --user 65534:65534 \
              "$IMAGE" \
              sh -c 'while :; do sleep 1; done' \
              >/dev/null
          done

          echo "=== T9: Deny external network attempt ==="

          test "$(docker inspect -f \
            '{{.HostConfig.NetworkMode}}' "$A")" = "none"

          docker exec "$A" sh -c '
            if wget -T 2 -q -O /dev/null \
              http://1.1.1.1/ 2>/dev/null; then
              echo "FAIL T9: external connection succeeded"
              exit 1
            fi
            echo "PASS T9: external request rejected"
          '

          echo "=== T10: Revoke an active synthetic operation ==="

          docker exec "$A" sh -c \
            'echo ACTIVE > /tmp/grant'

          docker exec "$A" sh -c '
            while test -f /tmp/grant; do
              sleep 0.1
            done
            echo "Operation stopped after revocation"
          ' &
          WORKER_PID=$!

          sleep 0.5

          START=$(date +%s%3N)
          docker exec "$A" rm /tmp/grant

          # Wait up to 5 seconds for the synthetic operation.
          for i in $(seq 1 50); do
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          if kill -0 "$WORKER_PID" 2>/dev/null; then
            echo "FAIL T10: operation did not stop"
            exit 1
          fi

          wait "$WORKER_PID"
          WORKER_PID=""

          END=$(date +%s%3N)
          ELAPSED=$((END - START))

          echo "Revocation response: ${ELAPSED} ms"
          test "$ELAPSED" -le 5000

          echo "PASS T10: synthetic operation stopped"

          echo "=== T11: Cleanup after synthetic failure ==="

          docker run -d \
            --name "$C" \
            --network none \
            --memory 512m \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            "$IMAGE" sleep 60 >/dev/null

          # Isolated failure handling: C must be removed.
          if (
            trap 'docker rm -f "$C" >/dev/null 2>&1' EXIT
            echo "Simulating failure of scenario C"
            exit 42
          ); then
            echo "FAIL T11: failure was not detected"
            exit 1
          fi

          if docker inspect "$C" >/dev/null 2>&1; then
            echo "FAIL T11: failed scenario remains"
            exit 1
          fi

          echo "PASS T11: failed scenario cleaned"

          echo "=== T12: Other scenario remains intact ==="

          test "$(docker inspect -f \
            '{{.State.Running}}' "$B")" = "true"

          docker exec "$B" sh -c '
            echo B_ALIVE > /tmp/status
            test "$(cat /tmp/status)" = B_ALIVE
          '

          echo "PASS T12: independent scenario preserved"

          echo "=== Cleanup exclusively owned workers ==="
          docker rm -f "$A" "$B" >/dev/null

          for NAME in "$A" "$B" "$C"; do
            if docker inspect "$NAME" >/dev/null 2>&1; then
              echo "FAIL: residual worker $NAME"
              exit 1
            fi
          done

          trap - EXIT
          echo "PASS: consolidated controls T9-T12"
