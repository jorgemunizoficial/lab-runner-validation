name: Public Synthetic Integral Validation Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit authorized by a separate execution order"
        required: true
        type: string
      execution_order:
        description: "Public non-secret execution-order identifier"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: synthetic-integral-validation
  cancel-in-progress: false

jobs:
  integral-validation:
    if: ${{ false && inputs.candidate_sha == github.sha && inputs.execution_order != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      PUBLIC_IMAGE: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      MAX_WORKER_SECONDS: "60"
      MAX_CYCLE_SECONDS: "900"
      MAX_FIXTURE_BYTES: "1048576"
      MAX_CASE_BYTES: "10485760"
      MAX_CYCLE_BYTES: "41943040"
      MAX_RECEIVER_BYTES: "1048576"
      MAX_RECEIVER_RATE_BPS: "131072"
      MAX_CONNECTIONS: "8"
      MAX_GRANT_SECONDS: "30"
      MAX_RECHECK_MS: "1000"
      MAX_STOP_MS: "5000"
      MAX_LINK_SECONDS: "30"
      MAX_BLOCK_BYTES: "65536"
      MAX_CLEANUP_SECONDS: "120"
      CANDIDATE_SHA_INPUT: ${{ inputs.candidate_sha }}
      EXECUTION_ORDER_INPUT: ${{ inputs.execution_order }}
      MODEL_SOURCE_SHA256: ccc303669767239c1a2055c3ad2aaad728461b0d3f8f77d1a11cbfcd1e34ce02

    steps:
      - name: Admission guard
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_SHA_INPUT" = "$GITHUB_SHA"
          test -n "$EXECUTION_ORDER_INPUT"
          case "$EXECUTION_ORDER_INPUT" in
            *[!A-Za-z0-9._-]*|'') echo "invalid public execution order id"; exit 64 ;;
          esac
          echo "admission=accepted-for-authorized-candidate"

      - name: Prepare owned synthetic control plane
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PREFIX="synthetic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ROOT="$RUNNER_TEMP/$PREFIX"
          test ! -e "$ROOT" && test ! -L "$ROOT"
          mkdir -m 700 "$ROOT"
          mkdir -m 700 "$ROOT/evidence" "$ROOT/fixtures" "$ROOT/state"
          printf '%s\n' "$PREFIX" > "$ROOT/state/prefix"
          mkdir -m 700 "$ROOT/state/ledger" "$ROOT/state/intents"
          python3 - <<'PY'
          import os, pathlib, time, json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/('synthetic-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          (root/'state'/'cycle-start').write_text(str(time.monotonic()), encoding='utf-8')
          (root/'state'/'phase.json').write_text(json.dumps({'phase':'work','cleanup_started':None}),encoding='utf-8')
          PY
          printf 'ROOT=%s\n' "$ROOT" >> "$GITHUB_ENV"
          printf 'OWNED_PREFIX=%s\n' "$PREFIX" >> "$GITHUB_ENV"
          cat > "$ROOT/state/control.sh" <<'SH'
          set -euo pipefail
          clock_ms() {
            python3 -c 'import time; print(time.monotonic_ns()//1000000)'
          }
          check_root() {
            test -n "${ROOT:-}" && test -n "${OWNED_PREFIX:-}" || return 1
            test "$ROOT" = "$RUNNER_TEMP/$OWNED_PREFIX" || return 1
            test ! -L "$ROOT" && test -d "$ROOT/state" || return 1
            test "$(cat "$ROOT/state/prefix")" = "$OWNED_PREFIX"
          }
          # The persisted phase is monotonic. Cleanup, inventory and seal share one window.
          phase_name() {
            python3 -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["ROOT"])/"state"/"phase.json").read_text())["phase"])'
          }
          require_work_phase() { test "$(phase_name)" = work; }
          enter_cleanup() {
            python3 - <<'PY'
          import json,os,pathlib,time
          root=pathlib.Path(os.environ['ROOT']); path=root/'state'/'phase.json'
          state=json.loads(path.read_text())
          if state['phase']=='cleanup':
              if not isinstance(state['cleanup_started'],(int,float)): raise SystemExit('invalid cleanup clock')
          elif state['phase']=='work':
              state={'phase':'cleanup','cleanup_started':time.monotonic()}
              temp=root/'state'/('.phase-'+os.urandom(8).hex())
              with temp.open('xb') as f:
                  f.write(json.dumps(state).encode());f.flush();os.fsync(f.fileno())
              temp.replace(path)
              fd=os.open(root/'state',os.O_RDONLY|os.O_DIRECTORY)
              try: os.fsync(fd)
              finally: os.close(fd)
          else: raise SystemExit('invalid cycle phase')
          PY
          }
          deadline_seconds() {
            DC_SECONDS="${DC_SECONDS:-5}" python3 - <<'PY'
          import json,os,pathlib,time
          root=pathlib.Path(os.environ['ROOT']); now=time.monotonic()
          start=float((root/'state'/'cycle-start').read_text()); state=json.loads((root/'state'/'phase.json').read_text())
          end=start+int(os.environ['MAX_CYCLE_SECONDS'])
          if state['phase']=='work': end-=int(os.environ['MAX_CLEANUP_SECONDS'])
          elif state['phase']=='cleanup': end=min(end,float(state['cleanup_started'])+int(os.environ['MAX_CLEANUP_SECONDS']))
          else: raise SystemExit('invalid cycle phase')
          remaining=end-now-1.0
          if remaining<=0: raise SystemExit('deadline admission refused')
          print(min(float(os.environ['DC_SECONDS']),remaining))
          PY
          }
          dc() {
            local seconds phase
            phase=$(phase_name) || return 1
            if test "$phase" = cleanup; then
              case "$1" in ps|inspect|rm|kill|wait) ;; *) echo 'work admission closed'; return 1 ;; esac
            elif test "$phase" != work; then return 1; fi
            seconds=$(deadline_seconds) || return 1
            timeout --signal=TERM --kill-after=1s "${seconds}s" docker "$@"
          }
          create_intent() {
            require_work_phase || return 1
            CREATED_NAME="$1" python3 - <<'PY'
          import hashlib,json,os,pathlib,time
          root=pathlib.Path(os.environ['ROOT']); name=os.environ['CREATED_NAME']
          if name not in (os.environ['OWNED_PREFIX']+'-worker',os.environ['OWNED_PREFIX']+'-peer'):
              raise SystemExit('invalid owned name')
          token=os.urandom(16).hex()
          data={'intent':token,'name':name,'cycle':os.environ['OWNED_PREFIX'],'candidate':os.environ['GITHUB_SHA'],
                'owner':'public-synthetic-executor','created_monotonic':time.monotonic()}
          target=root/'state'/'intents'/(token+'.json')
          with target.open('xb') as f:
              f.write(json.dumps(data,sort_keys=True,separators=(',',':')).encode());f.flush();os.fsync(f.fileno())
          target.chmod(0o400)
          fd=os.open(target.parent,os.O_RDONLY|os.O_DIRECTORY)
          try: os.fsync(fd)
          finally: os.close(fd)
          print(token)
          PY
          }
          record_owned() {
            CREATED_ID="$1" CREATED_NAME="$2" CREATED_INTENT="$3" python3 - <<'PY'
          import hashlib,json,os,pathlib,re,time
          root=pathlib.Path(os.environ['ROOT']); identifier=os.environ['CREATED_ID']; token=os.environ['CREATED_INTENT']
          if not re.fullmatch('[0-9a-f]{64}',identifier) or not re.fullmatch('[0-9a-f]{32}',token):
              raise SystemExit('invalid identity')
          before={line.split()[0] for line in (root/'evidence'/'docker-before.txt').read_text().splitlines()}
          if identifier in before: raise SystemExit('pre-existing identity refused')
          intent_path=root/'state'/'intents'/(token+'.json')
          if intent_path.is_symlink(): raise SystemExit('symlink intent refused')
          raw=intent_path.read_bytes(); intent=json.loads(raw)
          if intent['candidate']!=os.environ['GITHUB_SHA'] or intent['cycle']!=os.environ['OWNED_PREFIX'] or intent['name']!=os.environ['CREATED_NAME'] or intent['intent']!=token or intent['owner']!='public-synthetic-executor':
              raise SystemExit('intent mismatch')
          receipt={'id':identifier,'intent':token,'intent_sha256':hashlib.sha256(raw).hexdigest(),
                   'cycle':os.environ['OWNED_PREFIX'],'candidate':os.environ['GITHUB_SHA'],'name':os.environ['CREATED_NAME'],
                   'created_monotonic':time.monotonic(),'owner':'public-synthetic-executor'}
          folder=root/'state'/'ledger'; target=folder/(identifier+'.json')
          temp=folder/('.pending-'+identifier+'-'+os.urandom(8).hex())
          with temp.open('xb') as f:
              f.write(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode());f.flush();os.fsync(f.fileno())
          temp.chmod(0o400)
          # Exclusive hard-link publication is atomic and refuses an existing target.
          os.link(temp,target,follow_symlinks=False)
          fd=os.open(folder,os.O_RDONLY|os.O_DIRECTORY)
          try:
              os.fsync(fd);temp.unlink();os.fsync(fd)
          finally: os.close(fd)
          PY
          }
          cleanup_event() {
            test -n "$1" || return 1
            printf '{"resource":"%s","status":"%s"}\n' "$2" "$3" >> "$1"
          }
          owned_rm() {
            check_root || return 1
            enter_cleanup || return 1
            local selection ids errors id inventory owner candidate failed=0 report
            selection=$(python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path(os.environ['ROOT']); errors=[]; candidates=[]; intents={}
          def bad(path,reason):
              errors.append({'entry_hash':hashlib.sha256(path.name.encode()).hexdigest(),'reason':reason})
          for path in sorted((root/'state'/'intents').iterdir()):
              try:
                  if path.is_symlink() or not path.is_file() or not re.fullmatch(r'[0-9a-f]{32}\.json',path.name):
                      raise ValueError('invalid intent entry')
                  raw=path.read_bytes(); data=json.loads(raw)
                  if data['intent']+'.json'!=path.name or data['cycle']!=os.environ['OWNED_PREFIX'] or data['candidate']!=os.environ['GITHUB_SHA'] or data['owner']!='public-synthetic-executor':
                      raise ValueError('intent ownership mismatch')
                  intents[data['intent']]=(data,hashlib.sha256(raw).hexdigest())
              except Exception as error: bad(path,type(error).__name__)
          before={line.split()[0] for line in (root/'evidence'/'docker-before.txt').read_text().splitlines()}
          for path in sorted((root/'state'/'ledger').iterdir()):
              try:
                  if path.is_symlink() or not path.is_file(): raise ValueError('invalid receipt entry')
                  data=json.loads(path.read_bytes()); identifier=data['id']; token=data['intent']
                  if not re.fullmatch('[0-9a-f]{64}',identifier) or path.name!=identifier+'.json' or identifier in before:
                      raise ValueError('invalid receipt identity')
                  if data['cycle']!=os.environ['OWNED_PREFIX'] or data['candidate']!=os.environ['GITHUB_SHA'] or data['owner']!='public-synthetic-executor':
                      raise ValueError('receipt ownership mismatch')
                  intent,expected=intents[token]
                  if data['intent_sha256']!=expected or data['name']!=intent['name']: raise ValueError('intent proof mismatch')
                  candidates.append(data)
              except Exception as error: bad(path,type(error).__name__)
          counts={token:sum(row['intent']==token for row in candidates) for token in intents}
          valid=[]
          for row in candidates:
              if counts[row['intent']]!=1: errors.append({'resource':row['id'],'reason':'ambiguous intent'})
              else: valid.append(row['id'])
          for token in intents:
              if counts[token]==0: errors.append({'intent':token,'reason':'unresolved create intent'})
          print(json.dumps({'candidate':os.environ['GITHUB_SHA'],'cycle':os.environ['OWNED_PREFIX'],
                            'valid_ids':valid,'errors':errors,'unknown_resources_preserved':True},sort_keys=True))
          PY
            ) || return 1
            ids=$(SELECTION="$selection" python3 -c 'import json,os; print(" ".join(json.loads(os.environ["SELECTION"])["valid_ids"]))') || return 1
            errors=$(SELECTION="$selection" python3 -c 'import json,os; print(len(json.loads(os.environ["SELECTION"])["errors"]))') || return 1
            report="$ROOT/evidence/cleanup-$(clock_ms).jsonl"
            if ! (set -o noclobber; printf '%s\n' "$selection" > "$report"); then
              echo 'cleanup_evidence_loss=true' >&2;failed=1;report=''
            fi
            if test "$errors" -ne 0; then failed=1; fi
            for id in $ids; do
              if ! inventory=$(dc ps -aq --no-trunc); then
                cleanup_event "$report" "$id" inventory_error || failed=1
                failed=1;continue
              fi
              if ! printf '%s\n' "$inventory" | grep -Fx "$id" >/dev/null; then
                cleanup_event "$report" "$id" already_absent || failed=1
                continue
              fi
              if ! owner=$(dc inspect -f '{{index .Config.Labels "synthetic.cycle"}}' "$id") ||
                 ! candidate=$(dc inspect -f '{{index .Config.Labels "synthetic.commit"}}' "$id"); then
                cleanup_event "$report" "$id" inspect_error || failed=1
                failed=1;continue
              fi
              if test "$owner" != "$OWNED_PREFIX" || test "$candidate" != "$GITHUB_SHA"; then
                cleanup_event "$report" "$id" ownership_mismatch || failed=1
                failed=1;continue
              fi
              if dc rm -f "$id" >/dev/null; then
                cleanup_event "$report" "$id" removal_ack_not_residue_proof || failed=1
              else
                cleanup_event "$report" "$id" removal_error || failed=1
                failed=1
              fi
            done
            return "$failed"
          }
          SH

      - name: Static host inventory before
        shell: bash
        run: |
          set -euo pipefail
          source "$ROOT/state/control.sh"
          check_root
          CPU=$(nproc)
          MEM_KIB=$(awk '/MemTotal:/{print $2}' /proc/meminfo)
          DISK_KIB=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2{print $4}')
          test "$CPU" -ge 4
          test "$MEM_KIB" -ge 8388608
          test "$DISK_KIB" -ge 4194304
          printf 'cpu=%s\nmem_kib=%s\ndisk_kib=%s\n' "$CPU" "$MEM_KIB" "$DISK_KIB" > "$ROOT/evidence/host-before.txt"
          dc ps -a --no-trunc --format '{{.ID}} {{.Names}}' > "$ROOT/state/docker-before.raw"
          sort "$ROOT/state/docker-before.raw" > "$ROOT/evidence/docker-before.txt"
          for suffix in worker peer receiver; do
            if awk '{print $2}' "$ROOT/evidence/docker-before.txt" | grep -Fxq "${OWNED_PREFIX}-${suffix}"; then
              echo 'resource name collision'; exit 1
            fi
          done

      - name: Prepare and inspect artificial logical controls
        shell: bash
        run: |
          set -euo pipefail
          source "$ROOT/state/control.sh"
          check_root
          require_work_phase
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/synthetic/controls.py"
          FETCH_SECONDS=$(DC_SECONDS=15 deadline_seconds)
          HTTP_STATUS=$(env -u http_proxy -u https_proxy -u HTTP_PROXY -u HTTPS_PROXY \
            -u all_proxy -u ALL_PROXY -u no_proxy -u NO_PROXY \
            curl -q --proxy '' --noproxy '*' --proto '=https' --proto-redir '=https' \
            --max-redirs 0 --tlsv1.2 --connect-timeout 5 --max-time "$FETCH_SECONDS" \
            --max-filesize 1048576 --fail --silent --show-error --write-out '%{http_code}' \
            --output "$ROOT/state/model.py.tmp" "$URL")
          test "$HTTP_STATUS" = 200
          printf '%s  %s\n' "$MODEL_SOURCE_SHA256" "$ROOT/state/model.py.tmp" | sha256sum -c - >/dev/null
          mv "$ROOT/state/model.py.tmp" "$ROOT/state/model.py"
          chmod 400 "$ROOT/state/model.py"
          # This future step observes only an artificial host-side logical model.
          # It is not independent supervision or an operational acceptance result.
          MODEL_SECONDS=$(DC_SECONDS=60 deadline_seconds)
          MODEL_DRIVER_ALLOWED=manual-locked-candidate \
            timeout --signal=TERM --kill-after=1s "${MODEL_SECONDS}s" \
            python3 -I "$ROOT/state/model.py" "$ROOT"

      - name: Run integral synthetic matrix
        shell: bash
        run: |
          set -euo pipefail
          source "$ROOT/state/control.sh"
          check_root
          IMAGE="$PUBLIC_IMAGE"
          PREFIX="$OWNED_PREFIX"
          WORKER="${PREFIX}-worker"
          PEER="${PREFIX}-peer"
          START_MS=$(clock_ms)
          finalize() {
            local rc=$?
            trap - EXIT INT TERM
            if ! owned_rm; then rc=1; fi
            exit "$rc"
          }
          trap finalize EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          DC_SECONDS=60 dc pull "$IMAGE" >/dev/null

          run_worker() {
            local name="$1"
            local id intent
            require_work_phase || return 1
            intent=$(create_intent "$name") || return 1
            id=$(dc create \
              --name "$name" \
              --label "synthetic.cycle=$OWNED_PREFIX" \
              --label "synthetic.commit=$GITHUB_SHA" \
              --log-driver none \
              --network none \
              --cpus 1 \
              --memory 512m \
              --memory-swap 512m \
              --pids-limit 64 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,noexec,size=256m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --user 65534:65534 \
              "$IMAGE" sleep "$MAX_WORKER_SECONDS") || return 1
            [[ "$id" =~ ^[0-9a-f]{64}$ ]] || return 1
            record_owned "$id" "$name" "$intent" || return 1
            dc start "$id" >/dev/null || return 1
            printf '%s\n' "$id"
          }

          WORKER=$(run_worker "${PREFIX}-worker")
          PEER=$(run_worker "${PREFIX}-peer")

          dc exec "$WORKER" sh -c 'echo alpha >/tmp/owned'
          dc exec "$PEER" sh -ec 'test -d /tmp; test ! -e /tmp/owned'

          dc exec "$WORKER" sh -c 'echo granted >/tmp/grant'
          test "$(dc exec "$WORKER" cat /tmp/grant)" = granted

          T0=$(clock_ms)
          dc exec "$WORKER" rm /tmp/grant
          dc rm -f "$WORKER" >/dev/null
          T1=$(clock_ms)
          STOP_MS=$((T1-T0))
          test "$STOP_MS" -le "$MAX_STOP_MS"
          WORKER=$(run_worker "${PREFIX}-worker")

          dc exec "$WORKER" sh -c 'printf synthetic-only >/tmp/incidental'
          test "$(dc exec "$WORKER" cat /tmp/incidental)" = synthetic-only

          dc exec "$WORKER" sh -c 'echo lifecycle >/tmp/state'
          dc rm -f "$WORKER" >/dev/null
          WORKER=$(run_worker "${PREFIX}-worker")
          dc exec "$WORKER" sh -ec 'test -d /tmp; test ! -e /tmp/state'

          test "$(dc inspect -f '{{.HostConfig.NetworkMode}}' "$WORKER")" = none
          dc exec "$WORKER" sh -c 'test ! -e /var/run/docker.sock'
          dc exec "$WORKER" sh -ec 'command -v ip >/dev/null; ip -4 route > /tmp/routes4; ip -6 route > /tmp/routes6; test ! -s /tmp/routes4; test ! -s /tmp/routes6; test ! -e /sys/class/net/eth0'
          # No external connection attempt: route inspection is not universal egress proof.

          dc exec "$WORKER" sh -c 'printf artificial-export >/tmp/export'
          dc exec "$WORKER" cat /tmp/export > "$ROOT/evidence/artificial-export.txt"
          (cd "$ROOT/evidence" && sha256sum artificial-export.txt > artificial-export.sha256 && sha256sum -c artificial-export.sha256 >/dev/null)

          printf '%s\n' "$IMAGE" > "$ROOT/evidence/image.txt"
          dc inspect -f '{{.HostConfig.NetworkMode}} {{.HostConfig.NanoCpus}} {{.HostConfig.Memory}} {{.HostConfig.PidsLimit}} {{.HostConfig.ReadonlyRootfs}} {{.Config.User}}' "$WORKER" > "$ROOT/evidence/worker-config.txt"

          dc rm -f "$WORKER" >/dev/null
          test "$(dc inspect -f '{{.State.Running}}' "$PEER")" = true
          dc rm -f "$PEER" >/dev/null

          END_MS=$(clock_ms)
          ELAPSED_MS=$((END_MS-START_MS))
          test "$ELAPSED_MS" -le $((MAX_CYCLE_SECONDS*1000))

          owned_rm
          trap - EXIT INT TERM
          printf 'stop_ms=%s\ncycle_ms=%s\n' "$STOP_MS" "$ELAPSED_MS" > "$ROOT/evidence/timings.txt"

      - name: Inventory after and residue gate
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          # Admission/preparation may have failed; never invent a root for cleanup.
          if test -z "${ROOT:-}"; then echo 'preparation_not_completed=true'; exit 1; fi
          source "$ROOT/state/control.sh"
          check_root
          cleanup_rc=0
          owned_rm || cleanup_rc=1
          dc ps -a --no-trunc --format '{{.ID}} {{.Names}}' > "$ROOT/state/docker-after.raw"
          sort "$ROOT/state/docker-after.raw" > "$ROOT/evidence/docker-after.txt"
          dc ps -aq --no-trunc --filter "label=synthetic.cycle=$OWNED_PREFIX" > "$ROOT/evidence/residue.txt"
          test ! -s "$ROOT/evidence/residue.txt"
          # Prove pre-existing container identity/name inventory is unchanged; never repair it.
          cmp "$ROOT/evidence/docker-before.txt" "$ROOT/evidence/docker-after.txt"
          test "$cleanup_rc" -eq 0
          python3 - <<'PY'
          import os,pathlib,time
          r=pathlib.Path(os.environ['ROOT'])
          elapsed=time.monotonic()-float((r/'state'/'cycle-start').read_text())
          if elapsed>int(os.environ['MAX_CYCLE_SECONDS']): raise SystemExit('cycle deadline exceeded')
          PY

      - name: Seal minimized synthetic evidence locally
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ROOT:-}" && test -d "$ROOT/evidence"
          source "$ROOT/state/control.sh"
          check_root
          enter_cleanup
          deadline_seconds >/dev/null
          SEAL_SECONDS=$(DC_SECONDS=120 deadline_seconds)
          timeout --signal=TERM --kill-after=1s "${SEAL_SECONDS}s" python3 - <<'PY'
          import hashlib,os,pathlib,time,json
          root=pathlib.Path(os.environ['ROOT']); evidence=root/'evidence'
          files=sorted(p for p in evidence.iterdir() if p.name!='SHA256SUMS')
          if not files or any(p.is_symlink() or not p.is_file() for p in files):
            raise SystemExit('invalid evidence inventory')
          manifest=''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files)
          tmp=root/'state'/'manifest.tmp'
          tmp.write_text(manifest,encoding='utf-8'); tmp.replace(evidence/'SHA256SUMS')
          total=0
          for p in root.rglob('*'):
            if p.is_symlink(): raise SystemExit('symlink refused')
            if p.is_file(): total+=p.stat().st_size
          if total>int(os.environ['MAX_CYCLE_BYTES']): raise SystemExit('cycle storage limit')
          elapsed=time.monotonic()-float((root/'state'/'cycle-start').read_text())
          if elapsed>int(os.environ['MAX_CYCLE_SECONDS']): raise SystemExit('cycle deadline exceeded')
          PY
          VERIFY_SECONDS=$(DC_SECONDS=120 deadline_seconds)
          (cd "$ROOT/evidence" && timeout --signal=TERM --kill-after=1s "${VERIFY_SECONDS}s" sha256sum -c SHA256SUMS >/dev/null)
          deadline_seconds >/dev/null
          echo 'evidence=local_ephemeral_only'

      - name: Final safety statement
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'coverage=INCOMPLETE'
          echo 'runtime_effectiveness=NOT_PROVEN'
          echo 'native_acceptance=NOT_EXECUTED'
          echo 'receiver_rate_connection_limits=ARTIFICIAL_MODEL_ONLY'
          echo 'authorization_link_lifecycle_controls=ARTIFICIAL_MODEL_ONLY'
          echo 'independent_guardian_and_recovery=NOT_PROVEN'
          echo 'logical_clock_is_not_wall_time=true'
          echo 'operational_readiness=BLOCKED'
          # Existing examples cannot constitute a complete acceptance campaign.
          # Even a future accidental removal of the admission lock must not report success.
          exit 78
