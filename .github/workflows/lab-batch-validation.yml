
name: LAB Consolidated Synthetic Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  batch-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Run consolidated controls T5-T8
        shell: bash
        run: |
          set -euo pipefail

          PREFIX="batch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          A="${PREFIX}-a"
          B="${PREFIX}-b"
          EVIDENCE=$(mktemp -d)
          WATCHDOG_PID=""

          cleanup() {
            if [ -n "$WATCHDOG_PID" ]; then
              kill "$WATCHDOG_PID" 2>/dev/null || true
              wait "$WATCHDOG_PID" 2>/dev/null || true
            fi

            docker rm -f "$A" "$B" \
              >/dev/null 2>&1 || true

            rm -rf -- "$EVIDENCE"
          }

          trap cleanup EXIT

          echo "=== Prepare public image ==="
          IMAGE="alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc"
          docker pull "$IMAGE"

          echo "=== Create independent synthetic workers ==="

          for NAME in "$A" "$B"; do
            docker run -d \
              --name "$NAME" \
              --network none \
              --cpus 1 \
              --memory 512m \
              --memory-swap 512m \
              --pids-limit 64 \
              --read-only \
              --tmpfs /tmp:rw,nosuid,noexec,size=256m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --user 65534:65534 \
              "$IMAGE" \
              sh -c 'while :; do sleep 1; done' \
              >/dev/null
          done

          echo "=== T5: Synthetic authorization revocation ==="

          docker exec "$A" sh -c \
            'echo ALLOW_A > /tmp/grant'

          docker exec "$B" sh -c \
            'echo ALLOW_B > /tmp/grant'

          docker exec "$A" sh -c \
            'test "$(cat /tmp/grant)" = "ALLOW_A"'

          docker exec "$B" sh -c \
            'test "$(cat /tmp/grant)" = "ALLOW_B"'

          docker exec "$A" rm /tmp/grant

          docker exec "$A" sh -c '
            if test -f /tmp/grant; then
              exit 1
            fi
          '

          docker exec "$B" sh -c \
            'test "$(cat /tmp/grant)" = "ALLOW_B"'

          echo "PASS T5: revoked grant denies new check"

          echo "=== T6: Fail-closed synthetic guardian ==="

          LEASE="$EVIDENCE/guardian-lease"
          echo ACTIVE > "$LEASE"

          (
            while test -f "$LEASE"; do
              sleep 0.1
            done

            docker kill "$A" >/dev/null
          ) &
          WATCHDOG_PID=$!

          START=$(date +%s%3N)
          rm "$LEASE"

          timeout 5s docker wait "$A" >/dev/null
          wait "$WATCHDOG_PID"
          WATCHDOG_PID=""

          END=$(date +%s%3N)
          ELAPSED=$((END - START))

          test "$ELAPSED" -le 5000

          test "$(docker inspect -f \
            '{{.State.Running}}' "$A")" = "false"

          test "$(docker inspect -f \
            '{{.State.Running}}' "$B")" = "true"

          echo "Guardian response: ${ELAPSED} ms"
          echo "PASS T6: simulated lease loss stops A"

          echo "=== T7: Synthetic evidence integrity ==="

          printf '%s\n' \
            'fixture=artificial' \
            'case=A' \
            'classification=PUBLIC_SYNTHETIC' \
            > "$EVIDENCE/evidence.txt"

          (
            cd "$EVIDENCE"
            sha256sum evidence.txt > manifest.sha256
            sha256sum -c manifest.sha256 >/dev/null
          )

          echo 'synthetic-tampering' \
            >> "$EVIDENCE/evidence.txt"

          if (
            cd "$EVIDENCE"
            sha256sum -c manifest.sha256 \
              >/dev/null 2>&1
          ); then
            echo "FAIL: alteration not detected"
            exit 1
          fi

          echo "PASS T7: tampering detected"

          echo "=== T8: Ownership and scoped cleanup ==="

          docker exec "$B" sh -c \
            'echo B_INTACT > /tmp/ownership'

          docker rm -f "$A" >/dev/null

          if docker inspect "$A" >/dev/null 2>&1; then
            echo "FAIL: A still exists"
            exit 1
          fi

          test "$(docker inspect -f \
            '{{.State.Running}}' "$B")" = "true"

          docker exec "$B" sh -c \
            'test "$(cat /tmp/ownership)" = "B_INTACT"'

          echo "PASS T8: B unaffected by cleanup of A"

          docker rm -f "$B" >/dev/null

          if docker inspect "$B" >/dev/null 2>&1; then
            echo "FAIL: B still exists"
            exit 1
          fi

          rm -rf -- "$EVIDENCE"
          trap - EXIT

          echo "PASS: consolidated controls T5-T8"
